<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Everdice</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Alegreya', serif;
      font-size: 28px;
      color: #fbbf24;
      margin-bottom: 16px;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .tip {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 8px;
      padding: 16px;
      margin-top: 24px;
    }
    .tip h3 {
      color: #fbbf24;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .tip p {
      font-size: 14px;
      margin-bottom: 0;
    }
    button {
      background: #d97706;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #b45309;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📜</div>
    <h1>You're Offline, Adventurer</h1>
    <p>It seems your connection to the realm has been severed. Check your internet connection and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
    <div class="tip">
      <h3>Tip for Future Journeys</h3>
      <p>Visit the Learn page and tap "Prepare for Offline" before your next adventure to download study materials.</p>
    </div>
  </div>
</body>
</html>
